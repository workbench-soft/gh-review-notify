[tools]
node = "24"
jq = "1.8.2"
"npm:markdownlint-cli2" = "0.24.0"
"npm:oxfmt" = "0.75.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"

[tasks.lint]
description = "Lint and format check the scripts and the Markdown"
# shfmt finds each shell script by its extension or shebang, so a new one can't miss the lint.
shell = "bash -c"
run = [
  "markdownlint-cli2",
  "shellcheck -S style $(shfmt -f .)",
  "shfmt -i 2 -ci -sr -d .",
  "oxfmt --check",
]

[tasks.test]
description = "Run the script against the canned GitHub answers"
run = "bash tests/run.sh"

[tasks.format]
description = "Format the scripts and the Markdown"
run = ["shfmt -i 2 -ci -sr -w .", "oxfmt"]
