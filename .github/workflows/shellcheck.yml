name: shellcheck

on:
  push:
    branches: [main]
  # The repo is public, so PRs from outside get checked too.
  pull_request:

# A newer push to the same branch or PR cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the repo.
permissions:
  contents: read

# Steps run in bash. On Windows the default would be PowerShell.
defaults:
  run:
    shell: bash

jobs:
  # The repo is public, so GitHub runners cost nothing. The tool is for macOS.
  shellcheck:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # mise.toml pins shellcheck, shfmt and oxfmt.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - run: mise run lint
      - run: command -v jq || brew install jq
      - run: bash tests/run.sh
