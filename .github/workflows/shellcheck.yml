name: shellcheck

on:
  push:
    branches: [main]
  # The repo is public, so PRs from outside get checked too.
  pull_request:

# The local-ci page cancels an older run and logs why, so the workflow sets no concurrency.

# The job only reads the repo.
permissions:
  contents: read

# Steps run in bash. On Windows the default would be PowerShell.
defaults:
  run:
    shell: bash

jobs:
  # The repo is public, so GitHub runners cost nothing. The tool is for macOS.
  shellcheck:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # mise.toml pins jq, shellcheck, shfmt and oxfmt.
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - run: mise run lint
      - run: mise run test
